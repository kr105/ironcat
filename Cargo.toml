[package]
name = "ironcat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bitflags = "2.11.0"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
dashmap = "6.1.0"
rand = "0.10"
ratatui = "0.30.0"
rkyv = { version = "0.8", features = ["std", "alloc", "bytecheck"] }
dirs = "6"
sha2 = "0.10.9"
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha1 = "0.10"
parking_lot = "0.12"
rayon = "1.10"
redb = "3"
uint = "0.10.0"
scrypt = { version = "0.11.0", default-features = false } # Scrypt PoW hash (N=1024,r=1,p=1)
siphasher = "1.0" # Stable keyed hashing for deterministic addr relay peer selection
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[lints.clippy]
# Base groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Safety and correctness
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
float_arithmetic = "warn"

# Code quality
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints that are more noise than value
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
manual_div_ceil = "allow" # triggered inside uint crate macro expansion

# Optimize crypto-heavy deps even in debug builds so PoW validation
# during header sync doesn't crawl (scrypt is ~15x slower at opt-level 0)
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.k256]
opt-level = 3

[[bench]]
name = "pow_bench"
harness = false

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49.0", features = ["test-util"] }
