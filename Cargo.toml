[package]
name = "ironcat"
version = "0.0.6"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
bitflags = "2.11.0"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"] }
dashmap = "6.1.0"
rand = "0.8.5"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
bincode = "1"
dirs = "6"
sha2 = "0.10.9"
parking_lot = "0.12"
redb = "2.6"
siphasher = "1.0" # Stable keyed hashing for deterministic addr relay peer selection
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[lints.clippy]
# Base groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Safety and correctness
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
float_arithmetic = "warn"

# Code quality
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints that are more noise than value
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49.0", features = ["test-util"] }
