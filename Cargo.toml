[package]
name = "ironcat"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
bitflags = "2.6.0"
byteorder = "1.5.0"
dashmap = "6.1.0"
log = "0.4.22"
rand = "0.8.5"
ratatui = "0.28.1"
sha2 = "0.10.8"
simplelog = { version = "0.12.2", features = ["paris"] }
time = "0.3.36"
tokio = { version = "1.40.0", features = ["full"] }

[lints.clippy]
# Base groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Safety and correctness
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
float_arithmetic = "warn"

# Code quality
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints that are more noise than value
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"